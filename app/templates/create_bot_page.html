

{% extends "_menu_bar.html" %}

{% block content %}

<br>

<form id="createBotForm">

    <h1 class="h3 mb-3 fw-normal">Create a new bot</h1>
    <p>Create a new bot by writing python code that drives the bot. Documentation on interacting with the API is coming.</p>
    <p id="message_area"></p>
    <div data-mdb-input-init class="form-outline">
        <textarea class="form-control" name="code" rows="4"></textarea>
        <label class="form-label" for="textAreaExample">Code</label>
    </div>

    <br>
    
    <button id="create_bot_button" class="w-100 btn btn-lg btn-primary" type="submit">Create bot</button>

</form>

<br>

<script>

      function check_token() {
        console.log("Checking token...")

        let token = sessionStorage.getItem('token') ;

        if (token) {
            console.log("Token found: " + token)
            const status_success =  fetch('/ping', {
                method: 'GET', // or 'POST', 'PUT', 'DELETE', etc.
                headers: {
                  'Authorization': 'Bearer ' + token, // Example header
                  'Content-Type': 'application/json', // Another example header
                },
              })
                .then(response => {
                  // Handle the response
                  if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                  }
                  return response.json(); // Assuming JSON response
                })
                .then(data => {
                  // Process the data
                  console.log(data);
                  if (data['status'] == 'success'){
                    return true;
                  } else {
                    return false;
                  }
                })
                .catch(error => {
                  // Handle errors
                  console.error('Error:', error);
                });
            return status_success;
        } else {
            console.log("Token not found")
            return false;
        }
    }

    if (check_token()) {
        console.log("Token found and verified");
    } else {
        console.log("Token not found, redirecing...");
        window.location.replace("/login_page");
    }



    console.log("JS executing...")
    // Get a reference to the form element
    const create_bot_button = document.getElementById('create_bot_button');
    const form = document.getElementById('createBotForm');
    const waring_message = document.getElementById('message_area');

    

    // Add an event listener for the submit event
    create_bot_button.addEventListener('click', function(event) {
        console.log("create bot pressed...")

        const token = sessionStorage.getItem('token') ;
        
        const code_str = form.elements.code.value;
        console.log(code_str)

        fetch('/create_bot', {
            method: 'POST', // or 'POST', 'PUT', 'DELETE', etc.
            headers: {
                'Authorization': 'Bearer ' + token, 
                'Content-Type': 'application/json', // Another example header
            },
            body: JSON.stringify({
                "code_str":code_str,
            }),
          })
          .then(response => {
            if (response.ok) {
                // Request successful, handle the response
                return response.json(); 
              } else if (response.status === 401) {
                // Unauthorized, redirect to login page
                window.location.replace("/login_page?next=%2F{{ url_for('create_bot_page') }}");
                throw new Error('Redirect');
                //return response.json(); 
              } else {
                // Other error, handle accordingly
                throw new Error('Network response was not ok. ');
              }
        })
            .then(data => {

                if (data["detail"]) {
                    waring_message.innerText = data["detail"];
                } 

                if (data["status"]=="success") {
                    waring_message.innerText = "success";
                    
                    poll_map_until_success();
                }
            })
            .catch(error => {
                // Handle errors
                console.error('Error:', error);
                waring_message.innerText = error;
            });
        
        event.preventDefault();

    });


    async function poll_map_until_success(interval = 100, timeout = 30000) {
        let startTime = Date.now();
      
        while (Date.now() - startTime < timeout) {
          try {
            const token = sessionStorage.getItem('token') ;
            
            const response = await fetch('/get_map', {
                method: 'GET', // or 'POST', 'PUT', 'DELETE', etc.
                headers: {
                    'Authorization': 'Bearer ' + token, 
                    'Content-Type': 'application/json', // Another example header
                }
              })
            const data = await response.json();
            console.log(data['global_params']['status'])

            if (data['global_params']['status'] === "running") {
                window.location.replace("/play");
            }
          } catch (error) {
            console.error("API request failed:", error);
          }
      
          await new Promise(resolve => setTimeout(resolve, interval));
        }
      
        throw new Error("Polling timeout exceeded");
      }
    
  </script>

{% endblock %}
