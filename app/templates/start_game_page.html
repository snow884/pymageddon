{% extends "_login.html" %}

{% block content %}

  <a href="/"><img class="pm-auth-logo mb-4" src="/static/website/assets/pics/zoom_blur_logo.png?v=i2v-20261002" width="256" height="256" alt="Pymageddon cow-car"></a>

  <h1 class="h3 mb-1">Ready to survive?</h1>
  <p class="text-body-secondary mb-4">Eat, avoid being eaten, and climb the leaderboard.</p>

  <div id="message_area" class="pm-message alert alert-warning py-2 small" role="alert"></div>

  <button id="new_game_button" class="w-100 btn btn-lg btn-primary" type="submit"><i class="bi bi-play-fill me-1"></i>Start new game</button>

  <div class="row g-2 mt-4 text-start" id="score_table">
    <div class="col-6"><div class="pm-mini-stat"><div class="k">Games played</div><div class="v" id="player_games"><span class="spinner-border spinner-border-sm" role="status"></span></div></div></div>
    <div class="col-6"><div class="pm-mini-stat"><div class="k">Max score</div><div class="v" id="player_score"><span class="spinner-border spinner-border-sm" role="status"></span></div></div></div>
    <div class="col-6"><div class="pm-mini-stat"><div class="k">Bot games</div><div class="v" id="family_games"><span class="spinner-border spinner-border-sm" role="status"></span></div></div></div>
    <div class="col-6"><div class="pm-mini-stat"><div class="k">Bot max score</div><div class="v" id="family_score"><span class="spinner-border spinner-border-sm" role="status"></span></div></div></div>
  </div>

  <p class="small mt-4 mb-0"><a href="/" class="text-body-secondary"><i class="bi bi-arrow-left me-1"></i>Back to home</a></p>

    <script>
      console.log("JS executing...")
      // Get a reference to the form element

      // Add an event listener for the submit event

      console.log("new game pressed...")

      const token = sessionStorage.getItem('token') ;

      const player_games = document.getElementById('player_games');
      const player_score = document.getElementById('player_score');
      const family_games = document.getElementById('family_games');
      const family_score = document.getElementById('family_score');

      fetch('/score', {
          method: 'GET', // or 'POST', 'PUT', 'DELETE', etc.
          headers: {
              'Authorization': 'Bearer ' + token, 
              'Content-Type': 'application/json', // Another example header
          }
        })
        .then(response => {
          if (response.ok) {
              // Request successful, handle the response
              return response.json(); 
            } else if (response.status === 401) {
              // Unauthorized, redirect to login page
              window.location.replace("/login_page");
              throw new Error('Redirect');
              //return response.json(); 
            } else {
              // Other error, handle accordingly
              throw new Error('Network response was not ok.');
            }
      })
      .then(data => {
          const scores = (data && data['player_scores']) || {};
          const stat = (key) => (scores[key] === undefined || scores[key] === null) ? 0 : scores[key];

          player_games.innerText = stat('player_games');
          player_score.innerText = stat('player_score');
          family_games.innerText = stat('family_games');
          family_score.innerText = stat('family_score');

      })
      .catch(error => {
          console.error('Error:', error);
          const message = document.getElementById('message_area');
          if (message) {
              message.innerText = error;
          }
      });
    
    </script>
    
    <br>

    <script>
        console.log("JS executing...")
        // Get a reference to the form element
        const new_game_button = document.getElementById('new_game_button');
        const waring_message = document.getElementById('message_area');

        // Add an event listener for the submit event
        new_game_button.addEventListener('click', function(event) {
            event.preventDefault();
            const token = sessionStorage.getItem('token');
            if (!token) {
                window.location.replace("/login_page");
                return;
            }
            // /play starts the life after Pixi is ready. Starting here let the
            // cow starve while the play page was still downloading sprites.
            window.location.replace("/play");
        });

      </script>
{% endblock %}
