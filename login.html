<!doctype html>
<html>

    </head>
</head>
<body>

    <form id="loginForm">

      <p id="message_area"></p>
      <label for="uname"><b>Username</b></label>
      <input type="text" placeholder="Enter Username" name="username" required>
  
      <label for="psw"><b>Password</b></label>
      <input type="password" placeholder="Enter Password" name="password" required>
  
      <input type="submit">Login</button>

    
  </form>
  <br>
  <br>
  <a href="/create_player_page">Create new player</a>
  <script>
    console.log("JS executing...")
    // Get a reference to the form element
    const form = document.getElementById('loginForm');
    const waring_message = document.getElementById('message_area');
    // Add an event listener for the submit event
    form.addEventListener('submit', function(event) {
        console.log("Event submitted")
        const username = form.elements.username.value;
        const password = form.elements.password.value;

        fetch('/token', {
            method: 'POST', // or 'POST', 'PUT', 'DELETE', etc.
            headers: {
              'Content-Type': 'application/json', // Another example header
            },
            body: JSON.stringify({
                "username":username,
                "password":password
            }),
          })
            .then(response => {
                // Handle the response
                return response.json(); // Assuming JSON response
            })
            .then(data => {
                if (data["detail"]) {
                    waring_message.innerText = data["detail"];
                } 
                if (data["token_type"]=="bearer") {
                    console.log(data)
                    waring_message.innerText = "success";
                    sessionStorage.setItem('token', data["access_token"]);
                    window.location.replace("/");
                } 
            })
            .catch(error => {
                // Handle errors
                console.error('Error:', error);
            });
        event.preventDefault();

    });
  </script>
  </body>
  </html>
