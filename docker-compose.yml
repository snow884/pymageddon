services:
  pymageddon-redis-server:
    container_name: pymageddon-redis-server
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  pymageddon-server:
    container_name: pymageddon-server
    build:
      context: .
      dockerfile: docker_images/server/Dockerfile
    ports:
      - "${SERVER_PORT:-80}:80"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      pymageddon-redis-server:
        condition: service_healthy
    restart: unless-stopped

  pymageddon-game-node:
    container_name: pymageddon-game-node
    build:
      context: .
      dockerfile: docker_images/game-node/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      pymageddon-redis-server:
        condition: service_healthy
      pymageddon-server:
        condition: service_started
    restart: unless-stopped

volumes:
  redis-data:
