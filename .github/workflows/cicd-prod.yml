# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CICD prod

on:
  push:
    branches: [ master ]

jobs:

  check_python_code:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4 
        with:
          python-version: 'pypy3.10' 
      - run: echo "Update pip..."
      - run: pip install --upgrade pip
      - run: echo "Checking that the code for correctness..."
      - run: echo "Checking that the code is formatted correctly..."
      - run: pip install pre-commit==2.20.0
      - run: pre-commit run --all-files 


  build:

    needs: [run_unit_tests]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Docker
      uses: docker-practice/actions-setup-docker@master

    - name: Deploy service into ECS
      env:
        AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
        AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        AWS_REGION: us-east-1
        AWS_DEFAULT_REGION: us-east-1
      run: |
        cd docker_images && sh build_all.sh

    - name: Deployed!
      run: echo App successfully deployed 

